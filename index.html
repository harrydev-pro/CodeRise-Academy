<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CodeRise Academy: learn practical technology skills with free lessons, quizzes, projects, video courses, and full training programs." />
    <title>CodeRise Academy</title>
    <script>
      // Apply the saved (or system) theme before the page paints. Keep in sync with src/features/theme/theme.js.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("coderise-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1726");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
